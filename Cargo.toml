[package]
name = "pajama"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Open tmux project sessions by path, name, picker or history"
publish = false

[[bin]]
name = "pj"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
