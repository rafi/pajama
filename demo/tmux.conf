# A plain tmux look for the demo, in Catppuccin Mocha like the tape's theme.
set -g default-terminal tmux-256color
set -g escape-time 0
# Sessions are built and saved before the recording attaches, at the window size it will
# have: the 89x21 terminal minus the status line.
set -g default-size 89x20

set -g status-style bg=#181825,fg=#a6adc8
set -g status-left '#[bg=#cba6f7,fg=#11111b,bold] #S #[default] '
set -g status-left-length 30
set -g status-right ''
set -g window-status-format ' #I #W '
set -g window-status-current-format '#[fg=#cba6f7,bold] #I #W '
set -g pane-border-style fg=#313244
set -g pane-active-border-style fg=#cba6f7
set -g message-style bg=#313244,fg=#cdd6f4
